<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#F97316" opacity="0.1"/>
  <circle cx="100" cy="100" r="90" fill="white" stroke="#F97316" stroke-width="2"/>
  
  <!-- Shopping Bag with Store -->
  <g>
    <!-- Bag body -->
    <path d="M 55 70 L 60 50 Q 60 45 65 45 L 135 45 Q 140 45 140 50 L 145 70 Z" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 55 70 Q 50 75 50 85 L 50 155 Q 50 165 60 165 L 140 165 Q 150 165 150 155 L 150 85 Q 150 75 145 70" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Bag handles -->
    <path d="M 70 45 Q 70 25 100 25 Q 130 25 130 45" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Store window (small building inside bag) -->
    <rect x="75" y="90" width="50" height="45" fill="#FED7AA" stroke="#F97316" stroke-width="1.5" rx="3"/>
    <rect x="80" y="95" width="12" height="12" fill="#FBBF24" stroke="#F97316" stroke-width="1"/>
    <rect x="98" y="95" width="12" height="12" fill="#FBBF24" stroke="#F97316" stroke-width="1"/>
    <rect x="80" y="115" width="12" height="12" fill="#FBBF24" stroke="#F97316" stroke-width="1"/>
    <rect x="98" y="115" width="12" height="12" fill="#FBBF24" stroke="#F97316" stroke-width="1"/>
    
    <!-- Door -->
    <rect x="85" y="130" width="20" height="20" fill="#DC2626" stroke="#F97316" stroke-width="1" rx="2"/>
    <circle cx="102" cy="140" r="2" fill="#F97316"/>
  </g>
  
  <!-- Tagline text -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#F97316">SIKANTIN</text>
</svg>
